name: Turntide source asset-receiving guard
on:
  pull_request:
    paths:
      - 'scripts/derive-public.mjs'
      - 'scripts/public-asset-transaction.mjs'
      - 'test/public-asset-transaction.test.mjs'
      - '.github/workflows/public-asset-receiving.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: turntide-assets-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check the original builder and staging source
        run: |
          node --check scripts/derive-public.mjs
          node --check scripts/public-asset-transaction.mjs
      - name: Exercise native source-preserving promotion and failure recovery
        run: node --test test/public-asset-transaction.test.mjs
